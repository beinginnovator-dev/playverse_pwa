<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b22">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<title>PlayVerse • Sports + Puzzles v2</title>
<style>
:root{--bg:#07091d;--panel:#101633;--panel2:#151d46;--line:#34427e;--text:#f7f8ff;--muted:#aab2d4;--cyan:#29e8ff;--pink:#ff4fd8;--gold:#ffc83d;--green:#39e58c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% -10%,#24306b,#07091d 55%);color:var(--text)}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;padding:16px 16px 12px;background:rgba(7,9,29,.88);backdrop-filter:blur(14px);border-bottom:1px solid #202a55}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#18dcff,#8c3dff 52%,#ff4fd8);display:grid;place-items:center;font-size:26px;box-shadow:0 0 25px #5d45ff66}.brand h1{margin:0;font-size:22px}.brand small{color:var(--muted)}
.hero{margin:16px;padding:20px;border:1px solid #394887;border-radius:24px;background:linear-gradient(135deg,#17204b,#101632);box-shadow:0 20px 60px #0005}
.hero h2{font-size:30px;margin:0 0 8px}.hero p{color:var(--muted);margin:0 0 15px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 11px;border-radius:999px;background:#202b5a;color:#dfe5ff;font-size:13px}
.section{padding:0 16px;margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h3{margin:0}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{padding:9px 14px;border-radius:12px;background:#101633;border:1px solid #2c386c;white-space:nowrap}.tab.active{background:linear-gradient(135deg,#6d38ff,#b436ff);border-color:#b58bff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:14px;border:1px solid #303d75;border-radius:20px;background:linear-gradient(145deg,#111936,#0c1128);box-shadow:0 10px 30px #0003}.art{height:130px;border-radius:16px;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,#334d9a,#131a3a 55%,#0c1026)}.art:after{content:"";position:absolute;inset:auto -30px -55px;height:100px;background:linear-gradient(90deg,transparent,#35eaff33,transparent);transform:rotate(-12deg)}.card h4{margin:10px 0 4px;font-size:17px}.meta{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;margin-top:11px}.btn{flex:1;padding:11px 12px;border-radius:12px;background:#202b58;border:1px solid #3b4a8b}.btn.primary{background:linear-gradient(135deg,#7040ff,#c13bff);border-color:#a77bff}.btn.cyan{background:linear-gradient(135deg,#0babc8,#3479ff)}.btn:active{transform:scale(.98)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#0b1028ee;border-top:1px solid #293668;backdrop-filter:blur(16px);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;padding:8px;color:#9da8ce}.bottom button.active{color:#fff}
.hidden{display:none!important}
.screen{padding:16px}.back{background:#18224b;border:1px solid #35457f;padding:10px 13px;border-radius:12px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.timer{font-size:28px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}.score{font-size:34px;font-weight:900}.gamebox{border:1px solid #394887;background:#0b112b;border-radius:24px;padding:14px;min-height:440px;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:auto;border-radius:18px;background:#11183a;touch-action:none}
.hud{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}.pill{padding:7px 10px;border-radius:10px;background:#17204a;border:1px solid #2f3c76;font-size:13px}
.overlay{position:absolute;inset:0;background:#07091ddd;display:grid;place-items:center;padding:25px;text-align:center;z-index:3}.modal{background:#121a3c;border:1px solid #5263a4;border-radius:22px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 70px #0008}.modal h2{margin-top:0}.duration{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.duration button{padding:10px 4px;border-radius:10px;background:#1a2450;border:1px solid #34427c}.duration button.sel{background:#7b43ff}.bigaction{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#7040ff,#c13bff);font-weight:800}
.instructions{color:var(--muted);line-height:1.5}.result{font-size:42px;font-weight:900}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#19234d;border:1px solid #4d61a5;padding:10px 16px;border-radius:999px;z-index:30;box-shadow:0 10px 30px #0008}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.art{height:145px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
const GAMES=[
{id:'arrow',name:'Arrow Zen',cat:'Sports',time:'1–5 min',icon:'🏹',desc:'Aim, release and beat the moving target.'},
{id:'hoop',name:'Hoop Rush',cat:'Sports',time:'1–5 min',icon:'🏀',desc:'Time your shots and build a streak.'},
{id:'goal',name:'Goal Strike',cat:'Sports',time:'1–5 min',icon:'⚽',desc:'Place precision shots past the keeper.'},
{id:'rally',name:'Table Rally',cat:'Sports',time:'1–5 min',icon:'🏓',desc:'Return fast balls with perfect timing.'},
{id:'target',name:'Target Toss',cat:'Sports',time:'1–5 min',icon:'🎯',desc:'Hit moving rings before time runs out.'},
{id:'sprint',name:'Sprint Dash',cat:'Sports',time:'1–5 min',icon:'🏃',desc:'Tap the lanes and avoid the barriers.'},
{id:'memory',name:'Memory Matrix',cat:'Puzzles',time:'1–5 min',icon:'🧠',desc:'Remember the glowing tiles.'},
{id:'numbers',name:'Number Rush',cat:'Puzzles',time:'1–5 min',icon:'🔢',desc:'Tap numbers in order as fast as possible.'},
{id:'colors',name:'Color Circuit',cat:'Puzzles',time:'1–5 min',icon:'🟣',desc:'Match the target color, not the word.'},
{id:'pattern',name:'Pattern Pulse',cat:'Puzzles',time:'1–5 min',icon:'✨',desc:'Repeat the growing sequence.'},
{id:'tiles',name:'Tile Shift',cat:'Puzzles',time:'1–5 min',icon:'🧩',desc:'Clear matching tiles before the clock.'},
{id:'path',name:'Path Finder',cat:'Puzzles',time:'1–5 min',icon:'🔷',desc:'Connect the route with the fewest moves.'}
];
let state={screen:'home',category:'All',duration:1,game:null,score:0,roundEnd:0,raf:0,gameData:null};

const $=id=>document.getElementById(id);
function toast(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function formatTime(ms){return Math.max(0,ms/1000).toFixed(1)+'s'}
function goHome(){cancelAnimationFrame(state.raf);state.screen='home';state.game=null;render()}
function render(){
const a=$('app');
if(state.screen==='home') a.innerHTML=homeHTML();
else if(state.screen==='games') a.innerHTML=gamesHTML();
else if(state.screen==='game') a.innerHTML=gameShell();
else a.innerHTML=homeHTML();
}
function homeHTML(){return `<header><div class="brand"><div class="logo">⏱️</div><div><h1>PlayVerse</h1><small>Sports • Puzzles • Quick Challenges</small></div></div></header>
<section class="hero"><h2>Play. Think. Beat the clock.</h2><p>Original 1–5 minute games designed for quick head-to-head challenges.</p><div class="chips"><span class="chip">⚡ 1–5 min</span><span class="chip">🏆 1 / 3 / 5 games</span><span class="chip">🎮 Original games</span></div></section>
<section class="section"><div class="sectionhead"><h3>Sports</h3><button class="btn" onclick="openGames('Sports')">See all</button></div><div class="grid">${GAMES.filter(g=>g.cat==='Sports').slice(0,4).map(cardHTML).join('')}</div></section>
<section class="section"><div class="sectionhead"><h3>Puzzles</h3><button class="btn" onclick="openGames('Puzzles')">See all</button></div><div class="grid">${GAMES.filter(g=>g.cat==='Puzzles').slice(0,4).map(cardHTML).join('')}</div></section>
${bottomHTML('home')}`;}
function cardHTML(g){return `<article class="card"><div class="art">${g.icon}</div><h4>${g.name}</h4><div class="meta">${g.cat} • ${g.time}</div><div class="row"><button class="btn primary" onclick="startGame('${g.id}')">Play</button><button class="btn cyan" onclick="challenge('${g.id}')">Challenge</button></div></article>`}
function gamesHTML(){let list=state.category==='All'?GAMES:GAMES.filter(g=>g.cat===state.category);return `<header><div class="brand"><button class="back" onclick="goHome()">←</button><div><h1>Game Arena</h1><small>${list.length} original games</small></div></div></header><section class="screen"><div class="tabs">${['All','Sports','Puzzles'].map(x=>`<button class="tab ${state.category===x?'active':''}" onclick="filterGames('${x}')">${x}</button>`).join('')}</div><div class="grid" style="margin-top:14px">${list.map(cardHTML).join('')}</div></section>${bottomHTML('games')}`;}
function bottomHTML(active){return `<nav class="bottom"><button class="${active==='home'?'active':''}" onclick="goHome()">⌂<br>Home</button><button class="${active==='games'?'active':''}" onclick="openGames('All')">🎮<br>Games</button><button onclick="toast('Challenge room is next — choose Challenge on any game')">⚔️<br>Challenge</button></nav>`}
function openGames(cat){state.screen='games';state.category=cat;render()}
function filterGames(cat){state.category=cat;render()}
function challenge(id){toast('Challenge selected • '+GAMES.find(g=>g.id===id).name);startGame(id)}
function startGame(id){cancelAnimationFrame(state.raf);state.game=GAMES.find(g=>g.id===id);state.screen='game';state.duration=1;state.score=0;state.roundEnd=0;render();setTimeout(()=>openStart(),30)}
function gameShell(){return `<section class="screen"><button class="back" onclick="goHome()">← Back</button><div class="gamehead"><div><h2 style="margin:0">${state.game.name}</h2><div class="meta">${state.game.cat} • ${state.duration} minute round</div></div><div class="timer" id="timer">01:00</div></div><div class="hud"><div class="score" id="score">0</div><div class="pill" id="status">Ready</div></div><div class="gamebox" id="gamebox"></div></section>`}
function openStart(){const box=$('gamebox');box.innerHTML=`<div class="overlay"><div class="modal"><div style="font-size:55px">${state.game.icon}</div><h2>${state.game.name}</h2><p class="instructions">${state.game.desc}</p><div class="meta">Choose round length</div><div class="duration">${[1,2,3,4,5].map(n=>`<button class="${n===1?'sel':''}" onclick="chooseDuration(${n},this)">${n}m</button>`).join('')}</div><button class="bigaction" onclick="launchGame()">Start Game</button></div></div>`}
function chooseDuration(n,el){state.duration=n;document.querySelectorAll('.duration button').forEach(b=>b.classList.remove('sel'));el.classList.add('sel')}
function launchGame(){state.roundEnd=performance.now()+state.duration*60000;state.score=0;$('score').textContent='0';$('gamebox').innerHTML='';initGame(state.game.id);tick()}
function tick(){const left=state.roundEnd-performance.now();$('timer').textContent=new Date(Math.max(0,left)).toISOString().substr(14,5);if(left<=0){finishGame()}else state.raf=requestAnimationFrame(tick)}
function setScore(n){state.score=Math.max(0,n);$('score').textContent=state.score}
function finishGame(){cancelAnimationFrame(state.raf);$('timer').textContent='00:00';$('status').textContent='Finished';$('gamebox').innerHTML=`<div class="overlay"><div class="modal"><div class="result">${state.score}</div><h2>Round Complete!</h2><p class="instructions">${state.game.name} • ${state.duration} minute challenge</p><div class="row"><button class="btn primary" onclick="launchGame()">Play Again</button><button class="btn" onclick="openGames('${state.game.cat}')">More Games</button></div></div></div>`}
function initGame(id){
if(id==='arrow') return gameArrow();
if(id==='hoop') return gameHoop();
if(id==='goal') return gameGoal();
if(id==='rally') return gameRally();
if(id==='target') return gameTarget();
if(id==='sprint') return gameSprint();
if(id==='memory') return gameMemory();
if(id==='numbers') return gameNumbers();
if(id==='colors') return gameColors();
if(id==='pattern') return gamePattern();
if(id==='tiles') return gameTiles();
if(id==='path') return gamePath();
}
/* ---------- SPORTS ---------- */
function makeCanvas(){const c=document.createElement('canvas');c.width=700;c.height=500;$('gamebox').appendChild(c);return c}
function gameArrow(){const c=makeCanvas(),x=c.getContext('2d');let tx=350,ty=170,move=0;function draw(){x.clearRect(0,0,700,500);let cx=350+Math.sin(move)*210,cy=170+Math.cos(move*.8)*80;x.fillStyle='#10204a';x.fillRect(0,0,700,500);for(let r=110;r>15;r-=24){x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=r<40?'#ff4fd8':r<65?'#ffd23f':'#28dfff';x.fill()}x.strokeStyle='#aebcff';x.lineWidth=4;x.beginPath();x.moveTo(350,450);x.lineTo(350,250);x.stroke();x.fillStyle='#fff';x.beginPath();x.moveTo(350,450);x.lineTo(340,410);x.lineTo(360,410);x.fill();move+=.035;state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,py=(e.clientY-r.top)*500/r.height;let cx=350+Math.sin(move)*210,cy=170+Math.cos(move*.8)*80,d=Math.hypot(px-cx,py-cy);if(d<110)setScore(state.score+(d<30?10:d<55?7:4));else toast('Miss!')})}
function gameHoop(){const c=makeCanvas(),x=c.getContext('2d');let balls=[];function draw(){x.clearRect(0,0,700,500);x.fillStyle='#152650';x.fillRect(0,0,700,500);x.strokeStyle='#ff8d4d';x.lineWidth=10;x.strokeRect(0,350,700,150);x.fillStyle='#ff4fd8';x.fillRect(485,130,130,12);x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();x.arc(550,180,48,0,7);x.stroke();x.fillStyle='#ff9b39';balls.forEach(b=>{x.beginPath();x.arc(b.x,b.y,18,0,7);x.fill()});x.fillStyle='#fff';x.font='24px system-ui';x.fillText('Tap when the ball crosses the hoop',170,60);state.raf2=requestAnimationFrame(draw)}draw();let last=0;c.addEventListener('pointerdown',()=>{let t=performance.now();let delta=t-last;last=t;if(delta>450&&delta<1500){setScore(state.score+3);toast('Perfect +3')}else{setScore(state.score+1);toast('Shot +1')}})}
function gameGoal(){const c=makeCanvas(),x=c.getContext('2d');let keeper=350;function draw(){x.fillStyle='#123b2e';x.fillRect(0,0,700,500);x.strokeStyle='#fff';x.lineWidth=5;x.strokeRect(90,80,520,350);x.strokeStyle='#35eaff';x.beginPath();x.moveTo(90,260);x.lineTo(610,260);x.stroke();x.fillStyle='#ff4fd8';x.beginPath();x.arc(keeper,205,28,0,7);x.fill();x.fillStyle='#fff';x.font='24px system-ui';x.fillText('Tap left / center / right to shoot',190,470);state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width;let zone=px<230?0:px>470?2:1;let k=keeper<350?0:keeper>430?2:1;if(zone!==k){setScore(state.score+5);toast('GOAL! +5')}else{toast('Saved!')}keeper=100+Math.random()*500})}
function gameRally(){const c=makeCanvas(),x=c.getContext('2d');let y=250;function draw(){x.fillStyle='#092d32';x.fillRect(0,0,700,500);x.fillStyle='#197f8b';x.fillRect(40,80,620,340);x.fillStyle='#fff';x.fillRect(345,80,10,340);x.fillStyle='#ffdf5a';x.beginPath();x.arc(350,y,13,0,7);x.fill();x.fillStyle='#ff4fd8';x.fillRect(70,230,25,80);x.fillStyle='#29e8ff';x.fillRect(605,190,25,80);y=250+Math.sin(performance.now()/170)*120;x.font='23px system-ui';x.fillStyle='#fff';x.fillText('Tap as the ball reaches your side',190,460);state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',()=>{let good=Math.abs(y-250)<100;if(good)setScore(state.score+2);else toast('Late!')})}
function gameTarget(){const c=makeCanvas(),x=c.getContext('2d');let t=0;function draw(){x.clearRect(0,0,700,500);x.fillStyle='#101d3d';x.fillRect(0,0,700,500);let cx=350+Math.sin(t)*250,cy=250+Math.cos(t*.7)*150;for(let r=70;r>10;r-=20){x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=r<30?'#ff4fd8':r<50?'#ffd23f':'#29e8ff';x.fill()}t+=.03;state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,py=(e.clientY-r.top)*500/r.height,cx=350+Math.sin(t)*250,cy=250+Math.cos(t*.7)*150,d=Math.hypot(px-cx,py-cy);if(d<70)setScore(state.score+(d<25?8:4));})}
function gameSprint(){const c=makeCanvas(),x=c.getContext('2d');let lane=1,obs=[];function draw(){x.fillStyle='#10203a';x.fillRect(0,0,700,500);for(let i=1;i<3;i++){x.strokeStyle='#56679e';x.beginPath();x.moveTo(i*233,0);x.lineTo(i*233,500);x.stroke()}x.fillStyle='#29e8ff';x.beginPath();x.arc(lane*233+116,420,30,0,7);x.fill();obs.forEach(o=>{o.y+=5;x.fillStyle='#ff4f78';x.fillRect(o.l*233+75,o.y,80,35)});if(Math.random()<.025)obs.push({l:Math.floor(Math.random()*3),y:-40});obs=obs.filter(o=>o.y<500);if(obs.some(o=>o.l===lane&&o.y>380)){obs=[];toast('Barrier!')}state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width;lane=Math.max(0,Math.min(2,Math.floor(px/233)));setScore(state.score+1)})}
/* ---------- PUZZLES ---------- */
function gameNumbers(){const c=makeCanvas(),x=c.getContext('2d');let next=1,nums=[];function reset(){nums=Array.from({length:16},(_,i)=>i+1).sort(()=>Math.random()-.5)}function draw(){x.fillStyle='#10183a';x.fillRect(0,0,700,500);nums.forEach((n,i)=>{const cx=120+(i%4)*155,cy=100+Math.floor(i/4)*100;x.fillStyle=n===next?'#7a45ff':'#1d2a58';x.fillRect(cx-50,cy-35,100,70);x.fillStyle='#fff';x.font='28px system-ui';x.textAlign='center';x.fillText(n,cx,cy+10)});state.raf2=requestAnimationFrame(draw)}reset();draw();c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,py=(e.clientY-r.top)*500/r.height,col=Math.floor((px-70)/155),row=Math.floor((py-65)/100),i=row*4+col;if(i>=0&&i<16&&nums[i]===next){next++;setScore(state.score+1);if(next>16){toast('Board cleared!');next=1;reset()}}})}
function gameMemory(){const c=makeCanvas(),x=c.getContext('2d');let seq=[],show=[],level=3,active=false;function start(){seq=Array.from({length:level},()=>Math.floor(Math.random()*12));show=[...seq];active=true;setTimeout(()=>{show=[];active=false},700+level*250)}function draw(){x.fillStyle='#10183a';x.fillRect(0,0,700,500);for(let i=0;i<12;i++){let cx=110+(i%4)*160,cy=110+Math.floor(i/4)*130;x.fillStyle=show.includes(i)?'#ff4fd8':'#202c5d';x.fillRect(cx-45,cy-45,90,90)}x.fillStyle='#fff';x.font='22px system-ui';x.fillText('Memorize the glowing tiles',230,470);state.raf2=requestAnimationFrame(draw)}draw();start();let user=[];c.addEventListener('pointerdown',e=>{if(active)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,py=(e.clientY-r.top)*500/r.height,col=Math.floor((px-65)/160),row=Math.floor((py-65)/130),i=row*4+col;if(i>=0&&i<12){user.push(i);if(user[user.length-1]!==seq[user.length-1]){toast('Wrong pattern');user=[];level=3;start()}else if(user.length===seq.length){setScore(state.score+level);level=Math.min(7,level+1);user=[];setTimeout(start,350)}}})}
function gameColors(){const c=makeCanvas(),x=c.getContext('2d');let colors=['#ff4fd8','#29e8ff','#ffd23f','#45e68d'],target=0;function draw(){x.fillStyle='#10183a';x.fillRect(0,0,700,500);x.fillStyle='#fff';x.font='25px system-ui';x.fillText('Tap the COLOR shown below',220,70);x.fillStyle=colors[target];x.beginPath();x.arc(350,170,65,0,7);x.fill();colors.forEach((co,i)=>{x.fillStyle=co;x.fillRect(90+i*145,320,90,90)});state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,idx=Math.floor((px-90)/145);if(idx===target){setScore(state.score+2);target=Math.floor(Math.random()*4)}else toast('Wrong color')})}
function gamePattern(){const c=makeCanvas(),x=c.getContext('2d');let seq=[],user=[],playing=false;function newRound(){seq=[...seq,Math.floor(Math.random()*4)];user=[];playing=true;showSeq()}function showSeq(){let i=0;const iv=setInterval(()=>{if(i>=seq.length){clearInterval(iv);playing=false;return}flash(seq[i++])},400)}function flash(i){const cols=['#ff4fd8','#29e8ff','#ffd23f','#45e68d'];x.fillStyle=cols[i];x.fillRect((i%2)*350,Math.floor(i/2)*250,350,250);setTimeout(draw,220)}function draw(){x.fillStyle='#11183a';x.fillRect(0,0,700,500);[['#ff4fd8',0,0],['#29e8ff',350,0],['#ffd23f',0,250],['#45e68d',350,250]].forEach(a=>{x.fillStyle=a[0];x.globalAlpha=.55;x.fillRect(a[1]+10,a[2]+10,330,230);x.globalAlpha=1})}draw();newRound();c.addEventListener('pointerdown',e=>{if(playing)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*700/r.width,py=(e.clientY-r.top)*500/r.height,i=(py>250?2:0)+(px>350?1:0);user.push(i);if(i!==seq[user.length-1]){toast('Pattern broken');seq=[];setTimeout(newRound,300)}else if(user.length===seq.length){setScore(state.score+seq.length);setTimeout(newRound,300)}})}
function gameTiles(){const c=makeCanvas(),x=c.getContext('2d');let a=Array.from({length:16},()=>Math.floor(Math.random()*4));function draw(){x.fillStyle='#10183a';x.fillRect(0,0,700,500);a.forEach((v,i)=>{const cx=100+(i%4)*165,cy=95+Math.floor(i/4)*100,co=['#ff4fd8','#29e8ff','#ffd23f','#45e68d'][v];x.fillStyle=co;x.fillRect(cx-45,cy-30,90,60)});state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),col=Math.floor(((e.clientX-r.left)*700/r.width-55)/165),row=Math.floor(((e.clientY-r.top)*500/r.height-65)/100),i=row*4+col;if(i>=0&&i<16){a[i]=(a[i]+1)%4;setScore(state.score+1)}})}
function gamePath(){const c=makeCanvas(),x=c.getContext('2d');let cells=Array(25).fill(0),cur=0,target=24;cells[0]=1;function draw(){x.fillStyle='#10183a';x.fillRect(0,0,700,500);for(let i=0;i<25;i++){let cx=110+(i%5)*125,cy=75+Math.floor(i/5)*85;x.fillStyle=i===cur?'#29e8ff':i===target?'#ff4fd8':'#202b58';x.fillRect(cx-30,cy-30,60,60);x.fillStyle='#fff';x.font='18px system-ui';x.textAlign='center';x.fillText(i+1,cx,cy+7)}state.raf2=requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),col=Math.floor(((e.clientX-r.left)*700/r.width-48)/125),row=Math.floor(((e.clientY-r.top)*500/r.height-33)/85),i=row*5+col;if(i===cur+1){cur=i;setScore(state.score+1);if(cur===target){toast('Path solved!');cur=0}}else if(i!==cur){toast('Connect the next tile')}})}
window.openGames=openGames;window.filterGames=filterGames;window.startGame=startGame;window.challenge=challenge;window.goHome=goHome;window.chooseDuration=chooseDuration;window.launchGame=launchGame;window.addEventListener('error',e=>{document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#07091d;color:white;font-family:system-ui;text-align:center"><div><h2>PlayVerse could not start</h2><p style="color:#aab2d4">The app detected a startup error. Please refresh once.</p><button onclick="location.reload()" style="padding:13px 20px;border:0;border-radius:12px;background:#7040ff;color:white;font-weight:700">Refresh PlayVerse</button></div></div>';console.error(e.error||e.message)});
render();
