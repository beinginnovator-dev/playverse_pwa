<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b20">
<meta name="description" content="PlayVerse — original 1–5 minute multiplayer games">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#070a1b;--panel:#10152f;--panel2:#151b3d;--line:#30386b;--text:#f8f9ff;--muted:#aab2d4;--purple:#7c3cff;--cyan:#11d8ff;--pink:#ff4ec8;--green:#20e28a;--gold:#ffd24a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#24205b 0,#070a1b 40%,#050713 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;color:white;cursor:pointer}.shell{max-width:1180px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px;padding:8px 4px 16px}.logo{font-size:27px;font-weight:900;background:linear-gradient(90deg,#fff,#bfa9ff,#12d9ff);-webkit-background-clip:text;color:transparent}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#0c1027}.spacer{flex:1}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3cff,#11d8ff);font-size:20px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.panel{background:linear-gradient(145deg,rgba(20,26,57,.96),rgba(9,13,31,.96));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 15px 50px #0007}.hero{min-height:270px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 80% 25%,#7c3cff66,transparent 35%),linear-gradient(135deg,#171a42,#0c1230)}h1{font-size:clamp(32px,6vw,60px);margin:8px 0;line-height:1}.grad{background:linear-gradient(90deg,#ff7bdc,#9d7cff,#2be7ff);-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{background:linear-gradient(100deg,#7c3cff,#a24bff);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 8px 25px #7c3cff44}.secondary{background:#17204a;border:1px solid #3b4781;padding:12px 18px;border-radius:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:#121a3c;border:1px solid #303b70;color:var(--muted)}.chip.active{background:#7c3cff;color:white;border-color:#a47bff}.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game{min-height:115px;padding:12px;border:1px solid #30386b;border-radius:16px;background:linear-gradient(145deg,#18204a,#0e1430);position:relative;overflow:hidden}.game .art{font-size:34px}.game strong{display:block;margin-top:8px}.game small{color:var(--muted)}.badge{position:absolute;right:8px;top:8px;font-size:11px;color:#fff;background:#7c3cffaa;border-radius:9px;padding:4px 6px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:sticky;bottom:8px;margin-top:14px;background:#080c20eF;border:1px solid #252e5d;border-radius:18px;padding:8px;backdrop-filter:blur(14px);z-index:5}.nav button{background:transparent;color:var(--muted);padding:8px;border-radius:12px}.nav button.active{background:#1b2250;color:white}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #283261;border-radius:15px;background:#0e1430}.status{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}.match-card{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.select{padding:13px;border-radius:14px;background:#0d1430;border:1px solid #2f396e;text-align:center}.select.active{border-color:#9a6cff;box-shadow:0 0 0 2px #7c3cff44 inset}.chat{height:390px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:9px 11px;border-radius:14px;background:#171f45;color:#e9ebff}.msg.me{margin-left:auto;background:#6f38dc}.composer{display:flex;gap:8px;margin-top:10px}.composer input,.name-input{flex:1;background:#0b1028;color:white;border:1px solid #303a70;border-radius:14px;padding:12px;outline:none}.score{font-size:48px;font-weight:900;text-align:center}.timer{font-size:26px;font-weight:900;color:#2be7ff}.arena{min-height:300px;display:grid;place-items:center;border:1px dashed #45518d;border-radius:18px;background:radial-gradient(circle,#18224c,#080c20)}.tap{width:145px;height:145px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#8b5cff 25%,#5b21b6 70%);font-size:22px;font-weight:900;box-shadow:0 0 45px #7c3cff99}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.game-grid{grid-template-columns:repeat(2,1fr)}.shell{padding:9px}.panel{padding:14px}.top{padding-bottom:10px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:11px}.selects{grid-template-columns:1fr 1fr 1fr}.hero{min-height:230px}}

.game{padding:8px;display:flex;flex-direction:column;text-align:left}.game-main{background:transparent;padding:6px;text-align:left;min-height:82px}.game-main .art{font-size:34px}.game-main strong{display:block;margin-top:6px}.game-main small{color:var(--muted)}.game-actions{display:flex;gap:6px;margin-top:5px}.mini{padding:8px 10px;font-size:12px}.game-actions .primary,.game-actions .secondary{flex:1}.challenge-box{margin-top:14px;padding:14px;border:1px solid #3a4680;border-radius:16px;background:#0d1430}.full{width:100%;margin-top:12px}

</style>
</head>
<body>
<div id="app"><main style="min-height:100vh;display:grid;place-items:center;color:white;font-family:system-ui;padding:30px;text-align:center"><div><div style="font-size:48px">🎮</div><h1 style="margin:8px 0">PlayVerse</h1><p>Loading your game hub…</p></div></main></div>
<script>
const CATALOG=[
['Tap Pulse','⚡','Arcade'],['Color Sprint','🌈','Arcade'],['Memory Bloom','🧠','Puzzle'],['Target Burst','🎯','Action'],['Number Rush','🔢','Puzzle'],['Path Flick','🌀','Arcade'],['Bubble Pop','🫧','Arcade'],['Quick Match','✦','Puzzle'],['Orbit Dodge','🪐','Action'],['Goal Strike','⚽','Sports'],['Hoop Dash','🏀','Sports'],['Shuttle Snap','🏸','Sports'],['Table Rally','🏓','Sports'],['Ring Toss','⭕','Sports'],['Arrow Zen','🏹','Sports'],['Drift Dash','🏎️','Racing'],['Rocket Lane','🚀','Racing'],['Sky Glide','🛸','Arcade'],['Gem Grid','💎','Puzzle'],['Word Burst','🔤','Puzzle'],['Tile Flip','🔲','Puzzle'],['Pattern Pop','🎨','Puzzle'],['Mine Maze','🧩','Puzzle'],['Coin Catch','🪙','Arcade'],['Star Catch','⭐','Arcade'],['Fruit Flick','🍉','Arcade'],['Cannon Cloud','☁️','Action'],['Laser Lane','🔦','Action'],['Shield Rush','🛡️','Action'],['Meteor Tap','☄️','Action'],['Castle Sprint','🏰','Action'],['Dragon Dash','🐉','Action'],['Jewel Jump','💠','Arcade'],['Neon Runner','🏃','Racing'],['Turbo Turn','🔄','Racing'],['River Hop','🌊','Arcade'],['Island Dash','🏝️','Racing'],['Snow Sprint','❄️','Racing'],['Volcano Run','🌋','Action'],['Forest Dash','🌲','Racing'],['Ludo Clash','🎲','Board'],['Carrom Clash','⚫','Board'],['Dice Duel','🎲','Board'],['Grid Four','🟦','Board'],['Castle Check','♟️','Board'],['Token Trail','🔵','Board'],['Number Tiles','🔢','Board'],['Hex Duel','⬡','Board'],['Line Four','➖','Board'],['Corner Capture','◩','Board'],['Quick Chess','♟️','Board'],['Mini Checkers','⚪','Board'],['Stack Drop','🧱','Puzzle'],['Block Slide','🟪','Puzzle'],['Shape Shift','🔺','Puzzle'],['Color Code','🔵','Puzzle'],['Lock Break','🔐','Puzzle'],['Sequence X','🔢','Puzzle'],['Memory Match','🃏','Puzzle'],['Pair Hunt','👯','Puzzle'],['Word Grid','🔠','Puzzle'],['Letter Rush','🆎','Puzzle'],['Spell Sprint','✍️','Puzzle'],['Math Sprint','➕','Puzzle'],['Fraction Dash','½','Puzzle'],['Logic Loop','🧠','Puzzle'],['Odd One','👁️','Puzzle'],['Quick Count','💯','Puzzle'],['Aim Arena','🎯','Action'],['Target Trail','🎯','Action'],['Cannon Pop','💥','Action'],['Shield Tap','🛡️','Action'],['Dodge Zone','💫','Action'],['Meteor Guard','☄️','Action'],['Robot Rush','🤖','Action'],['Alien Lane','👾','Action'],['Ninja Dash','🥷','Action'],['Samurai Snap','⚔️','Action'],['Dragon Aim','🐲','Action'],['Power Rings','💍','Sports'],['Penalty Pulse','🥅','Sports'],['Kick Curve','⚽','Sports'],['Basket Flick','🏀','Sports'],['Volleyball Tap','🏐','Sports'],['Badminton Burst','🏸','Sports'],['Table Spin','🏓','Sports'],['Sprint Split','🏃','Sports'],['Jump Meter','🦘','Sports'],['Balance Beam','🤸','Sports'],['Swim Dash','🏊','Sports'],['Cycling Sprint','🚴','Sports'],['Row Rush','🚣','Sports'],['Javelin Aim','🏹','Sports'],['Discus Dash','🥏','Sports'],['Mini Marathon','🏃','Sports'],['Ice Glide','⛸️','Sports'],['Ski Gates','⛷️','Sports'],['Snowboard Line','🏂','Sports'],['Archery Bloom','🏹','Sports'],['Torch Run','🔥','Sports'],['Rally Wheels','🏁','Racing'],['Drift Ring','🚗','Racing'],['Lane Switch','🛣️','Racing'],['Traffic Dash','🚦','Racing'],['Turbo Tunnel','🌀','Racing'],['Coast Sprint','🌊','Racing'],['Desert Dash','🏜️','Racing'],['Moon Rally','🌙','Racing'],['Comet Chase','☄️','Racing'],['Pulse Kart','🏎️','Racing'],['Glow Maze','💡','Arcade'],['Pixel Garden','🌱','Arcade'],['Cloud Catch','☁️','Arcade'],['Star Loop','🌟','Arcade'],['Prism Run','🔮','Arcade']];
const state={view:'home',name:(()=>{try{return localStorage.getItem('pvName')||'GameStar'}catch{return 'GameStar'}})(),duration:2,bestOf:1,selected:CATALOG.slice(0,3),room:null,score:0,time:120,game:null,chat:[['Aarav','Ready for a quick match? 🎮'],['Diya','2 minutes sounds perfect! ✨']],ws:null};
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['games','🎮','Games'],['match','⚔️','Match'],['chat','💬','Chat'],['profile','●','Profile']].map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="setView('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function topBar(){return `<header class="top"><div class="logo">PlayVerse</div><div class="pill">⚡ 1–5 MIN CHALLENGES</div><div class="spacer"></div><button class="avatar" onclick="setView('profile')">${state.name[0]?.toUpperCase()||'G'}</button></header>`}
function home(){return `<div class="grid"><section class="panel hero"><div class="pill" style="width:max-content">ORIGINAL GAMES • NO BRANDED GAME ASSETS</div><h1>Play. Chat.<br><span class="grad">Challenge.</span></h1><p class="sub">Fast head-to-head games built for a coffee break, a bus ride, or a friendly rematch. Pick 1, 3 or 5 games and choose 1–5 minutes per game.</p><div class="actions"><button class="primary" onclick="setView('match')">⚔️ Create Challenge</button><button class="secondary" onclick="setView('games')">🎮 Explore 100+ Games</button></div></section><section class="panel"><h2>Quick match</h2><p class="sub">Choose your round length.</p><div class="selects">${[1,2,3,4,5].map(n=>`<button class="select ${state.duration===n?'active':''}" onclick="duration(${n})">${n}<br><small>min</small></button>`).join('')}</div><div class="actions"><button class="primary" onclick="startQuick()">Play Now →</button></div><hr style="border-color:#29315f;margin:20px 0"><h3>Friends online</h3><div class="list">${['Aarav','Diya','Rohan'].map((n,i)=>`<div class="row"><div class="avatar">${['🧑🏻','👩🏻','🧑🏽'][i]}</div><div><b>${n}</b><div class="sub"><span class="status"></span> Online</div></div><div class="spacer"></div><button class="secondary" onclick="invite('${n}')">Challenge</button></div>`).join('')}</div></section></div><section class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Popular now</h2><button class="chip" onclick="setView('games')">See all →</button></div><div class="game-grid">${CATALOG.slice(0,9).map(card).join('')}</div></section>`}
function card(g){return `<div class="game"><span class="badge">1–5 min</span><button class="game-main" onclick="pickGame('${esc(g[0])}')"><div class="art">${g[1]}</div><strong>${esc(g[0])}</strong><small>${g[2]}</small></button><div class="game-actions"><button class="secondary mini" onclick="pickGame('${esc(g[0])}')">Play</button><button class="primary mini" onclick="createChallengeFor('${esc(g[0])}')">⚔ Challenge</button></div></div>`}
function games(){return `<section class="panel"><h2>100+ Original Games</h2><p class="sub">Every title below is an original game concept/implementation slot. No copied branded game art.</p><div class="chips" style="margin:12px 0">${['All','Arcade','Puzzle','Sports','Action','Board','Racing'].map(c=>`<button class="chip" onclick="filterGames('${c}')">${c}</button>`).join('')}</div><div id="catalog" class="game-grid">${CATALOG.map(card).join('')}</div></section>`}
function match(){return `<div class="grid"><section class="panel"><div style="display:flex;align-items:center;gap:10px"><div><h2>Create Challenge</h2><p class="sub">Challenge a friend directly from any game category.</p></div><div class="spacer"></div><span class="pill">${state.selected.length} game${state.selected.length>1?'s':''}</span></div><h3>Games per match</h3><div class="selects">${[1,3,5].map(n=>`<button class="select ${state.bestOf===n?'active':''}" onclick="bestOf(${n})">${n}<br><small>${n===1?'Single game':`First to ${Math.ceil(n/2)}`}</small></button>`).join('')}</div><h3>Time per game</h3><div class="selects">${[1,2,3,4,5].map(n=>`<button class="select ${state.duration===n?'active':''}" onclick="duration(${n})">${n} min</button>`).join('')}</div><h3>Selected games</h3><div class="list">${state.selected.map((g,i)=>`<div class="row"><b>${i+1}</b><span style="font-size:25px">${g[1]}</span><div><b>${esc(g[0])}</b><div class="sub">${g[2]} • ${state.duration} min</div></div><div class="spacer"></div><button class="chip" onclick="removeGame(${i})">×</button></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="setView('games')">＋ Add / Change games</button></div></section><section class="panel"><h2>Choose opponent</h2><p class="sub">Pick someone from your friends list, or create a shareable challenge link.</p><div class="list">${['Aarav','Diya','Rohan','Ishita'].map((n,i)=>`<div class="row"><div class="avatar">${['🧑🏻','👩🏻','🧑🏽','👩🏽'][i]}</div><div><b>${n}</b><div class="sub"><span class="status"></span> ${i<3?'Online':'Offline'}</div></div><div class="spacer"></div><button class="primary mini" onclick="challengeFriend('${n}')">Challenge</button></div>`).join('')}</div><div class="challenge-box"><b>Or invite anyone</b><p class="sub">Send the challenge through WhatsApp or copy the room link. They can join without being on your friends list.</p><div class="actions"><button class="secondary" onclick="shareInvite()">🟢 WhatsApp</button><button class="secondary" onclick="copyInvite()">🔗 Copy Link</button></div></div><button class="primary full" onclick="createRoom()">⚔️ Create Challenge Room</button><hr style="border-color:#29315f"><h3>Match rules</h3><p class="sub">• 1 game = winner takes the match.<br>• 3 games = first to 2 wins.<br>• 5 games = first to 3 wins.<br>• Every round is capped at the selected 1–5 minutes.</p></section></div>`}
function chat(){return `<section class="panel chat"><h2>Match Chat</h2><div class="messages">${state.chat.map(m=>`<div class="msg ${m[0]===state.name?'me':''}"><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('')}</div><div class="composer"><input id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">➤</button></div></section>`}
function profile(){return `<section class="panel"><div style="display:flex;align-items:center;gap:15px"><div class="avatar" style="width:68px;height:68px;font-size:32px">${state.name[0]?.toUpperCase()||'G'}</div><div><h2 style="margin:0">${esc(state.name)}</h2><p class="sub">Quick Challenger • Level 4</p></div></div><div class="actions"><input class="name-input" id="nameInput" value="${esc(state.name)}"><button class="primary" onclick="saveName()">Save</button></div><div class="grid" style="margin-top:14px"><div class="panel"><h3>🏆 Wins</h3><div class="score">24</div></div><div class="panel"><h3>⚡ Games</h3><div class="score">61</div></div></div></section>`}
function play(){let g=state.game||state.selected[0];return `<section class="panel"><div style="display:flex;align-items:center;gap:10px"><button class="secondary" onclick="setView('home')">←</button><div><b>${esc(g[0])}</b><div class="sub">${esc(g[2])} • ${state.duration} minute round</div></div><div class="spacer"></div><div class="timer" id="timer">${fmt(state.time)}</div></div><div class="score" id="score">${state.score}</div><div class="arena"><button class="tap" id="tap" onclick="tapPoint()">TAP!</button></div><div class="actions" style="justify-content:center"><button class="secondary" onclick="endRound()">Finish Round</button><button class="secondary" onclick="setView('chat')">💬 Chat</button></div></section>`}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function render(){document.querySelector('#app').innerHTML=`<div class="shell">${topBar()}${state.view==='home'?home():state.view==='games'?games():state.view==='match'?match():state.view==='chat'?chat():state.view==='profile'?profile():play()}${nav()}</div>`}
function setView(v){state.view=v;render(); if(v==='play')startRound()}
function duration(n){state.duration=n;state.time=n*60;render()}; function bestOf(n){state.bestOf=n;render()}; function pickGame(name){state.game=CATALOG.find(x=>x[0]===name)||CATALOG[0];setView('play')}; function removeGame(i){if(state.selected.length>1)state.selected.splice(i,1);render()}; function filterGames(cat){const el=$('#catalog');el.innerHTML=(cat==='All'?CATALOG:CATALOG.filter(g=>g[2]===cat)).map(card).join('')}
function createChallengeFor(name){const g=CATALOG.find(x=>x[0]===name)||CATALOG[0];state.game=g;state.selected=[g];state.bestOf=1;state.view='match';render()} function challengeFriend(name){createRoom().then(()=>{alert(`Challenge room created for ${name}. Send the generated link to ${name}.`)})} function startQuick(){state.game=state.selected[0];setView('play')}; function startRound(){clearInterval(window.pvTimer);state.score=0;state.time=state.duration*60;window.pvTimer=setInterval(()=>{state.time--;const t=$('#timer');if(t)t.textContent=fmt(state.time);if(state.time<=0)endRound(false)},1000)}
function tapPoint(){state.score++;const s=$('#score');if(s)s.textContent=state.score;const b=$('#tap');if(b){b.style.transform=`scale(${.94+Math.random()*.16})`;setTimeout(()=>b.style.transform='',90)}}
function endRound(manual=true){clearInterval(window.pvTimer);alert(`${state.game?.[0]||'Game'} finished! Your score: ${state.score}. Multiplayer synchronization is handled by the Cloudflare room service when deployed.`);setView('match')}
function saveName(){const v=$('#nameInput').value.trim();if(v){state.name=v;try{localStorage.setItem('pvName',v)}catch{}}render()}
function invite(n){alert(`Challenge prepared for ${n}. Use Invite via WhatsApp or Copy Link to send the room.`)}
function shareInvite(){const url=location.origin+location.pathname+'?room='+encodeURIComponent(state.room||'demo');const text=`Join my PlayVerse challenge: ${url}`;if(navigator.share)navigator.share({title:'PlayVerse Challenge',text,url});else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function copyInvite(){const url=location.origin+location.pathname+'?room='+encodeURIComponent(state.room||'demo');navigator.clipboard?.writeText(url);alert('Invite link copied!')}
function sendChat(){const i=$('#chatInput');if(!i?.value.trim())return;const text=i.value.trim(); state.chat.push([state.name,text]); if(state.ws&&state.ws.readyState===1) state.ws.send(JSON.stringify({type:'chat',name:state.name,text})); i.value=''; render(); setView('chat'); connectWS()}
async function createRoom(){state.room=crypto.randomUUID().slice(0,8);await connectWS();shareInvite()}
async function connectWS(){if(!state.room||state.ws)return;const proto=location.protocol==='https:'?'wss':'ws';try{state.ws=new WebSocket(`${proto}://${location.host}/api/room/${state.room}`);state.ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='chat'){state.chat.push([m.name,m.text]);if(state.view==='chat')render()}}catch{}};state.ws.onclose=()=>state.ws=null}catch{}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}render();

</script>
</body>
</html>
